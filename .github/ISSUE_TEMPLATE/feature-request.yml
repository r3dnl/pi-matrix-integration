name: Feature request
description: Propose something new
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem you have
      description: What you are trying to do that the extension does not support today.
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: How you would like it to work
      description: The room behaviour and the commands you expect. Config keys are user-facing surface — if your idea adds or renames one, say so.
    validations:
      required: true
