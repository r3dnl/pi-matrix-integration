name: Release

# Tag v* (story 16): pack, prove the tarball is clean and complete, stage it on
# npm through trusted publishing (OIDC — no long-lived token), and cut the
# GitHub release from the CHANGELOG section for that version. Staging is what
# npm asks CI to use now that direct publishing by token is being removed
# (January 2027): the run stages, a maintainer promotes with
#   npm stage approve <stage-id> --otp <code>
# so the version goes live only after a human with 2FA says so.

on:
  push:
    tags:
      - "v*"

# `id-token: write` is what lets npm fetch this run's OIDC claims and sign the
# release (provenance); `contents: write` is what lets `gh release create` push
# the release object with the default GITHUB_TOKEN. Without them the publish
# step fails before it publishes anything.
permissions:
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: npm # names the npm trusted publisher; holds no secret
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          # Node 22 ships npm 10.x, which has no `npm stage`. The trusted
          # publisher's own docs example publishes on Node 24.
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - name: "Gate first: every check the PR gate runs"
        run: |
          node tools/scan-secrets.mjs
          node tools/scan-secrets.mjs --self-check
          npm run typecheck
          npm run lint
          npm test
          node test/docs-consistency.mjs
      - name: Pack and gate the tarball
        run: |
          mkdir -p /tmp/pack
          npm pack --pack-destination /tmp/pack >/dev/null
          tar xzf /tmp/pack/*.tgz -C /tmp/pack
          node tools/scan-secrets.mjs --dir /tmp/pack/package
          node tools/check-tarball.mjs
      - name: Stage the release
        # Trusted publishing: npm authenticates with this run's OIDC token and
        # generates the provenance attestation itself, so there is no token to
        # hand it. `npm publish` here would fail E_STAGE_REQUIRED.
        run: |
          npm stage publish --provenance --access public
          echo "::notice::v$GITHUB_REF_NAME staged on npm — promote it with: npm stage approve <stage-id> --otp <code> (npm stage list prints the id)"
      - name: GitHub release with the CHANGELOG section
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          body=$(awk -v v="## \\[$version\\]" '
            $0 ~ v {found=1; next}
            found && /^## \[/ {exit}
            found {print}' CHANGELOG.md)
          if [ -z "$body" ]; then body="Release $GITHUB_REF_NAME"; fi
          gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes "$body"
