name: CI

# The required PR gate (story 16): the same commands as the local loop,
# in the agreed order — credential scan → typecheck → lint → offline test
# tier → docs consistency. A second job proves the package manifest and
# the packed tarball. No job in this workflow touches secrets; that is
# what makes "the offline tier really runs offline" provable.

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Credential scan (tree)
        run: node tools/scan-secrets.mjs
      - name: "Credential scan (self-check: the gate can bite)"
        run: node tools/scan-secrets.mjs --self-check
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Offline tier (npm test, no network needed)
        run: npm test
      - name: Docs consistency
        run: node test/docs-consistency.mjs

  manifest:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --omit=dev
      - name: Dependency contract (clean install, tree, peers, WASM)
        run: node test/deps-contract.mjs
      - name: Credential scan (unpacked tarball)
        run: |
          mkdir -p /tmp/pack
          # --ignore-scripts: `npm pack` fires the prepack typecheck guard,
          # and this job deliberately installs WITHOUT dev dependencies —
          # tsc is not here. The guard runs on publish (release.yml); this
          # step only needs the bytes the registry would receive.
          npm pack --ignore-scripts --pack-destination /tmp/pack >/dev/null
          tar xzf /tmp/pack/*.tgz -C /tmp/pack
          node tools/scan-secrets.mjs --dir /tmp/pack/package
      - name: Tarball content gate (files allowlist, license set)
        run: node tools/check-tarball.mjs
