name: CI

# Quality gate on every push and pull request (stories 4 + 7). Order is
# the agreed chain: credential scan → typecheck → lint → unit tier, plus
# the same scan over the unpacked `npm pack` tarball so a stray `files`
# entry cannot publish what the checkout scan missed.

on:
  push:
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Credential scan (tree)
        run: node tools/scan-secrets.mjs
      - name: Credential scan (self-check: the gate can bite)
        run: node tools/scan-secrets.mjs --self-check
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Unit + stubbed e2e tier (offline)
        run: npm test
      - name: Credential scan (unpacked tarball)
        run: |
          mkdir -p /tmp/pack
          npm pack --pack-destination /tmp/pack >/dev/null
          tar xzf /tmp/pack/*.tgz -C /tmp/pack
          node tools/scan-secrets.mjs --dir /tmp/pack/package
