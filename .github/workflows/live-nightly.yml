name: Live nightly

# Scheduled live gate (story 16): main only, never a fork PR — the
# homeserver credentials must not be reachable from a pull request someone
# else opened. Runs the live scenario tier and the performance gates. A
# failing run opens (or updates) one issue.

on:
  schedule:
    - cron: "30 4 * * *" # daily 04:30 UTC
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: live-nightly
  cancel-in-progress: false

jobs:
  # Secret hygiene over everything a push gate cannot see: the whole object
  # database (a credential that was committed and later deleted is still
  # cloneable) and gitleaks as an independent second opinion. Deliberately
  # separate from the live job — no homeserver secrets, so a homeserver
  # outage never hides a hygiene finding. Full history needs fetch-depth: 0.
  hygiene:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      # ~1.5 s over 800+ blobs, so it stays out of the push gate for clone
      # cost, not scan cost. The private-identifier registry is maintainer-
      # local and gitignored, so a runner scans without it unless one is
      # supplied as a secret.
      - name: Credential and identifier scan over all git objects
        # Drop continue-on-error once the history scrub (git filter-repo,
        # replace-text spec) lands; until then the estate identifiers in old
        # commits are known and reported here, not hidden.
        continue-on-error: true
        run: node tools/scan-secrets.mjs --history
      - name: gitleaks (independent cross-check, never gates a push)
        continue-on-error: true
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  live:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Live scenario tier
        run: npm run test:live
        env:
          # The live tier drives the extension through the pi harness, which
          # locates the pi package via `pi` on PATH — absent on a runner.
          # The devDependency installed above IS the package; point the
          # override at it (same version the suite's jiti compiles against).
          PI_MATRIX_TEST_PI_PKG: ${{ github.workspace }}/node_modules/@earendil-works/pi-coding-agent
          PI_MATRIX_HOMESERVER: ${{ secrets.PI_MATRIX_HOMESERVER }}
          PI_MATRIX_USERNAME: ${{ secrets.PI_MATRIX_USERNAME }}
          PI_MATRIX_PASSWORD: ${{ secrets.PI_MATRIX_PASSWORD }}
          PI_MATRIX_SECOND_TOKEN: ${{ secrets.PI_MATRIX_SECOND_TOKEN }}
          PI_MATRIX_SECOND_USER: ${{ secrets.PI_MATRIX_SECOND_USER }}
          PI_MATRIX_SECOND_PASSWORD: ${{ secrets.PI_MATRIX_SECOND_PASSWORD }}
          # The crypto reader re-presents a persistent device locally, where
          # its crypto store survives between runs. A CI runner is stateless:
          # an empty store beside the stored device_id means a NEW identity
          # registered under the OLD device, and Olm key shares encrypted to
          # the registered identity can never be unwrapped (NoOlm/withheld).
          # So the nightly mints a fresh reader device per run via password —
          # the same path the very first local run took, when it works. The
          # extension refetches device lists per run, so room keys are shared
          # with the fresh device at send time.
          PI_MATRIX_READER_USER: ${{ secrets.PI_MATRIX_USERNAME }}
          PI_MATRIX_READER_PASSWORD: ${{ secrets.PI_MATRIX_PASSWORD }}
      # The perf gates fail loudly until the performance suites land; keep
      # nightly red-free until they exist, then drop the continue-on-error.
      - name: Performance gates
        continue-on-error: true
        run: npm run test:perf
        env:
          PI_MATRIX_HOMESERVER: ${{ secrets.PI_MATRIX_HOMESERVER }}
          PI_MATRIX_USERNAME: ${{ secrets.PI_MATRIX_USERNAME }}
          PI_MATRIX_PASSWORD: ${{ secrets.PI_MATRIX_PASSWORD }}
      - name: Upload harness artifacts
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: live-nightly-${{ github.run_number }}
          path: artifacts/
          if-no-files-found: ignore
      - name: Open an issue on failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="Nightly live gate failed ($(date -u +%Y-%m-%d))"
          if gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "Nightly live gate failed in:title" | grep -q .; then
            echo "an open nightly-failure issue already exists; not opening a second"
            exit 0
          fi
          # Best-effort: a first nightly failure on a fresh repo has no
          # ci-nightly label, and a failed gh label create must not mask the
          # failure issue that this step exists to file.
          gh label create ci-nightly --color 9e4a14 \
            --description "Live nightly gate failure tracking issue" 2>/dev/null || true
          gh issue create --repo "$GITHUB_REPOSITORY" \
            --title "$title" \
            --body "Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID\n\nSee the run log and the uploaded artifacts." \
            --label ci-nightly || gh issue create --repo "$GITHUB_REPOSITORY" \
              --title "$title" \
              --body "Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID\n\nSee the run log and the uploaded artifacts."
