name: Live nightly

# Scheduled live gate (story 16): main only, never a fork PR — the
# homeserver credentials must not be reachable from a pull request someone
# else opened. Runs the live scenario tier and the performance gates. A
# failing run opens (or updates) one issue.

on:
  schedule:
    - cron: "30 4 * * *" # daily 04:30 UTC
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: live-nightly
  cancel-in-progress: false

jobs:
  live:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Materialize the reader device
        # The crypto reader is a persistent device (device_id + token): the
        # extension shares room keys with it, so it must re-present a known
        # device — which is exactly what a password login could not do. The
        # secret is the reader's whole credentials.json; an empty secret
        # leaves the file unwritten, and the suite then takes the plain
        # reader path (correct for non-auto-encrypting homeservers, loudly
        # failing for encrypting ones).
        env:
          PI_MATRIX_READER_CREDENTIALS_JSON: ${{ secrets.PI_MATRIX_READER_CREDENTIALS_JSON }}
        run: |
          if [ -n "$PI_MATRIX_READER_CREDENTIALS_JSON" ]; then
            mkdir -p "$RUNNER_TEMP/live-reader"
            printf '%s' "$PI_MATRIX_READER_CREDENTIALS_JSON" > "$RUNNER_TEMP/live-reader/credentials.json"
            chmod 600 "$RUNNER_TEMP/live-reader/credentials.json"
          fi
      - name: Live scenario tier
        run: npm run test:live
        env:
          PI_MATRIX_HOMESERVER: ${{ secrets.PI_MATRIX_HOMESERVER }}
          PI_MATRIX_USERNAME: ${{ secrets.PI_MATRIX_USERNAME }}
          PI_MATRIX_PASSWORD: ${{ secrets.PI_MATRIX_PASSWORD }}
          PI_MATRIX_SECOND_TOKEN: ${{ secrets.PI_MATRIX_SECOND_TOKEN }}
          PI_MATRIX_SECOND_USER: ${{ secrets.PI_MATRIX_SECOND_USER }}
          PI_MATRIX_SECOND_PASSWORD: ${{ secrets.PI_MATRIX_SECOND_PASSWORD }}
          PI_MATRIX_READER_CREDENTIALS: ${{ runner.temp }}/live-reader/credentials.json
      # The perf gates fail loudly until the performance suites land; keep
      # nightly red-free until they exist, then drop the continue-on-error.
      - name: Performance gates
        continue-on-error: true
        run: npm run test:perf
        env:
          PI_MATRIX_HOMESERVER: ${{ secrets.PI_MATRIX_HOMESERVER }}
          PI_MATRIX_USERNAME: ${{ secrets.PI_MATRIX_USERNAME }}
          PI_MATRIX_PASSWORD: ${{ secrets.PI_MATRIX_PASSWORD }}
      - name: Upload harness artifacts
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: live-nightly-${{ github.run_number }}
          path: artifacts/
          if-no-files-found: ignore
      - name: Open an issue on failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="Nightly live gate failed ($(date -u +%Y-%m-%d))"
          if gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "Nightly live gate failed in:title" | grep -q .; then
            echo "an open nightly-failure issue already exists; not opening a second"
            exit 0
          fi
          gh issue create --repo "$GITHUB_REPOSITORY" \
            --title "$title" \
            --body "Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID\n\nSee the run log and the uploaded artifacts." \
            --label ci-nightly
