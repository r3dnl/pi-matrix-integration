# Two services from one image (story 12). The repo is mounted read-only;
# everything the run writes lands in the container's own $HOME. Credentials
# come from the environment of whoever runs `make e2e` — never from this
# file and never baked into the image.
name: pi-matrix-e2e

services:
  e2e:
    build:
      context: .
      args:
        PI_VERSION: ${PI_VERSION:-1.5.2}
    # `make shell` opens here, not in /: the extension writes its config, state
    # and log under <cwd>/.pi/matrix, and / is root-owned.
    working_dir: /home/node/work
    volumes:
      - ../:/workspace:ro
      # scenario evidence lands here: the harness copies the repo into
      # ~/work, and the live tier writes artifacts/live-<run-id>/ there.
      # This mount brings the evidence out of the ephemeral container for
      # `make e2e` and the nightly upload step.
      - ../artifacts:/home/node/work/artifacts
      # A Pi model endpoint for the manual walkthrough (`make shell`).
      # /model reloads it. The offline service deliberately has no provider
      # — it must stay unable to reach a model.
      - ./models.json:/home/node/.pi/agent/models.json:ro
    environment:
      SOURCE: ${SOURCE:-tarball}
      PI_MATRIX_HOMESERVER: ${PI_MATRIX_HOMESERVER:-}
      PI_MATRIX_USERNAME: ${PI_MATRIX_USERNAME:-}
      PI_MATRIX_PASSWORD: ${PI_MATRIX_PASSWORD:-}
      PI_MATRIX_SECOND_TOKEN: ${PI_MATRIX_SECOND_TOKEN:-}
      PI_MATRIX_SECOND_USER: ${PI_MATRIX_SECOND_USER:-}
      PI_MATRIX_SECOND_PASSWORD: ${PI_MATRIX_SECOND_PASSWORD:-}
      # The crypto reader (docs/dev/testing.md): without these the live tier
      # cascades on a default-encryption homeserver — the in-container run
      # needs the reader exactly like the host shell does.
      PI_MATRIX_READER_USER: ${PI_MATRIX_READER_USER:-}
      PI_MATRIX_READER_PASSWORD: ${PI_MATRIX_READER_PASSWORD:-}

  # Same image, no network at all: stricter than "only the homeserver
  # reachable", and it proves the offline tier is really offline. The host
  # must have run `npm ci` first (node_modules rides along in the copy); the
  # npm cache is mounted so deps-contract's install step works offline.
  e2e-offline:
    build:
      context: .
      args:
        PI_VERSION: ${PI_VERSION:-1.5.2}
    network_mode: "none"
    volumes:
      - ../:/workspace:ro
      - ~/.npm/_cacache:/home/node/.npm/_cacache
    environment:
      MODE: offline
      SOURCE: ${SOURCE:-tarball}
